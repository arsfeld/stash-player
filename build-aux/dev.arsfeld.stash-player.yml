app-id: dev.arsfeld.stash-player
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: stash-player

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Network — talks to Stash over HTTP(S).
  - --share=network
  # Audio
  - --socket=pulseaudio
  # Hardware video acceleration via VA-API
  - --device=dri
  # libsecret / GNOME keyring for the Stash API key
  - --talk-name=org.freedesktop.secrets
  # Persist app config + thumbnail cache outside the sandbox
  - --filesystem=xdg-config/stash-player:create
  - --filesystem=xdg-cache/stash-player:create

# The freedesktop 25.08 runtime (which GNOME 50 is built on) ships gst-libav
# but NOT the patent-encumbered codec libraries it links against (libavcodec,
# libx264, libx265, libde265, …). Pull them in via the codecs-extra extension
# so playback works for H.264 / H.265 / AAC / AC-3 / etc.
add-extensions:
  org.freedesktop.Platform.codecs-extra:
    version: '25.08-extra'
    directory: lib/codecs-extra
    add-ld-path: lib
    no-autodownload: false
    autodelete: true

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  build-args:
    # Cargo needs to fetch crates from crates.io during the build. This
    # is allowed in personal/CI builds; Flathub submissions would have to
    # vendor sources offline (see flatpak-cargo-generator).
    - --share=network
  env:
    CARGO_HOME: /run/build/stash-player/cargo
    RUST_BACKTRACE: '1'

modules:
  - name: stash-player
    buildsystem: simple
    build-commands:
      - cargo build --release -p stash-player-ui --locked --manifest-path Cargo.toml
      - install -Dm755 target/release/stash-player-ui /app/bin/stash-player
      # Mountpoint for the codecs-extra extension declared at the top level.
      # Must exist at install time or flatpak refuses to mount the extension.
      - install -dm755 /app/lib/codecs-extra
      - install -Dm644 data/dev.arsfeld.stash-player.desktop
        /app/share/applications/dev.arsfeld.stash-player.desktop
      - install -Dm644 data/dev.arsfeld.stash-player.metainfo.xml
        /app/share/metainfo/dev.arsfeld.stash-player.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/dev.arsfeld.stash-player.svg
        /app/share/icons/hicolor/scalable/apps/dev.arsfeld.stash-player.svg
      - install -Dm644 data/icons/hicolor/symbolic/apps/dev.arsfeld.stash-player-symbolic.svg
        /app/share/icons/hicolor/symbolic/apps/dev.arsfeld.stash-player-symbolic.svg
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - target
          - .direnv
          - .env
          - .github
          - apps/flutter
