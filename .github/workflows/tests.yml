name: Tests

on:
  push:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy

      # The UI crate links gtk4 + libadwaita + gstreamer, so clippy on the
      # full workspace needs the system libs the dev shell provides.
      - name: Install GTK / libadwaita / GStreamer dev libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libadwaita-1-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev

      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: cargo test + coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # The UI crate (gtk4/gstreamer) isn't tested here, so the cache
          # key is scoped to the crates we actually compile.
          shared-key: tests

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Restrict to the crates that have tests. The stash-player-ui crate
      # pulls in gtk4 + gstreamer + libadwaita, which would force apt
      # installs and a much longer CI run for zero coverage gain (it has
      # no tests by design — relm4/GStreamer needs end-to-end runs).
      - name: Run tests with coverage
        run: cargo llvm-cov --no-report -p stash-api -p stash-player-core -p stash-player-proxy

      - name: Generate lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Write summary to job
        run: |
          {
            echo '## Coverage'
            echo ''
            echo '```'
            cargo llvm-cov report
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lcov artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
