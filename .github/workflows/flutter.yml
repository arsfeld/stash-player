name: Flutter

on:
  push:
    # `flutter` is the branch this client is being developed on; it gets the
    # same three-platform CI as main so the Windows build (which nobody
    # builds locally — there is no Windows dev shell) can't rot unnoticed
    # between merges.
    branches: [main, master, flutter]
    paths:
      - "apps/flutter/**"
      - "tools/mock-stash/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/flutter.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "apps/flutter/**"
      - "tools/mock-stash/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/flutter.yml"
  workflow_dispatch:

jobs:
  linux:
    name: Flutter Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v20

      - name: Verify Flutter client
        run: |
          nix develop .#flutter --command bash -c '
            set -e
            cd apps/flutter
            flutter pub get
            dart format --output=none --set-exit-if-changed .
            flutter analyze --fatal-infos --fatal-warnings
            flutter test
          '

      # Mock-only: proves the connection → library → scene wiring works
      # end-to-end against a real GraphQL backend, not that video plays.
      # `tools/mock-stash/server.py` keeps `/stream` a documented 404 by
      # design (see that file and `docs/flutter-runtime-validation.md`),
      # so this step's expected outcome is the scene screen's recoverable
      # playback-failure state, never real playback — see this step's own
      # name, which is load-bearing for exactly that reason.
      #
      # KNOWN NOT GREEN ON A STOCK RUNNER: this runner has no `DISPLAY`
      # (the `-d linux` integration test needs a real GTK window) and no
      # Secret Service provider (`flutter_secure_storage` throws), so
      # `AppController.bootstrap` falls back to the connection screen and
      # the test's library assertions never match. `continue-on-error` is
      # set deliberately so this failure is visible in the run summary
      # without blocking merges — it is not silently red or silently
      # vacuous, it is a documented, currently-unprovisioned gap (final
      # review I10). Provisioning `xvfb` + a Secret Service (`dbus-run-
      # session` + `gnome-keyring-daemon --unlock`) is the follow-up. Kept
      # in its own step (separate from the debug build below) so this
      # known gap can't mask a real build regression via `set -e`.
      - name: Connection/library smoke (mock stream; no playback validation)
        continue-on-error: true
        run: |
          nix develop .#flutter --command bash -c '
            set -e
            python3 tools/mock-stash/server.py &
            MOCK_PID=$!
            trap "kill $MOCK_PID 2>/dev/null || true" EXIT
            for i in $(seq 1 30); do
              curl -s -o /dev/null -X POST -H "content-type: application/json" -d "{}" http://127.0.0.1:9999/graphql && break
              sleep 1
            done
            cd apps/flutter
            STASH_URL=http://127.0.0.1:9999 STASH_API_KEY= flutter test integration_test/connection_library_scene_test.dart -d linux
          '

      - name: Flutter Linux debug build
        run: |
          nix develop .#flutter --command bash -c '
            set -e
            cd apps/flutter
            flutter build linux --debug
          '

  macos:
    name: Flutter macOS
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Not Nix — and unlike Windows, not for want of a dev shell, since
      # `devShells.flutter` does exist on Darwin. nixpkgs assembles its
      # Flutter SDK as a symlink farm into the read-only store, and
      # `UnpackMacOS` copies FlutterMacOS.framework with `rsync -av`
      # (no `-L`, see flutter_tools' darwin.dart), so the copy is still
      # links pointing back into the store and rsync's `--chmod` lands on
      # the links rather than their targets. `lipo` then can't write its
      # temp file beside the binary — "can't create temporary output file:
      # …/FlutterMacOS.lipo (Permission denied)" — and no chmod or env var
      # fixes it from outside, because the copy and the thinning happen
      # inside one build target. Same SDK pin as the Windows job, for the
      # same reason: every job on the version `nix develop .#flutter`
      # resolves. The dev shell still gets exercised — by the Linux job,
      # which genuinely needs its GTK3/mpv libraries.
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Verify Flutter client
        working-directory: apps/flutter
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed .
          flutter analyze --fatal-infos --fatal-warnings
          flutter test

      # Mock-only — see the Linux job's own step (above) for what "smoke"
      # means here and why the step exists at all; the step name is kept
      # byte-for-byte identical across both jobs. The two jobs are *not*
      # otherwise identical, though: each has its own "known not green"
      # cause below, since Linux and macOS don't share a root cause.
      #
      # KNOWN NOT GREEN ON A STOCK RUNNER: neither `Runner/DebugProfile.
      # entitlements` nor `Runner/Release.entitlements` declares a
      # `keychain-access-groups` entitlement, which a sandboxed
      # (`com.apple.security.app-sandbox`) macOS app needs for
      # `flutter_secure_storage`'s Keychain calls to succeed. Without it,
      # `PlatformConnectionStore.loadStored`'s `_secureStorage.read(...)`
      # throws unconditionally — even though this step overrides
      # `STASH_URL`/`STASH_API_KEY` via the environment, `loadEffective`
      # still calls `loadStored` first — so `AppController.bootstrap`
      # falls back to the connection screen and the test's library
      # assertions never match: the same failure shape as the Linux job's
      # missing Secret Service, for the macOS-native reason.
      # `continue-on-error` is set deliberately so this failure is visible
      # in the run summary without blocking merges — it is not silently
      # red or silently vacuous, it is a documented, currently-
      # unprovisioned gap (final review I10). Adding a
      # `keychain-access-groups` entitlement is the follow-up. Kept in its
      # own step (separate from the debug build below) so this known gap
      # can't mask a real build regression via `set -e`.
      - name: Connection/library smoke (mock stream; no playback validation)
        continue-on-error: true
        run: |
          python3 tools/mock-stash/server.py &
          MOCK_PID=$!
          trap 'kill "$MOCK_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -s -o /dev/null -X POST -H "content-type: application/json" -d "{}" http://127.0.0.1:9999/graphql && break
            sleep 1
          done
          cd apps/flutter
          STASH_URL=http://127.0.0.1:9999 STASH_API_KEY="" flutter test integration_test/connection_library_scene_test.dart -d macos

      - name: Flutter macOS debug build
        working-directory: apps/flutter
        run: flutter build macos --debug

  windows:
    name: Flutter Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nix, not the SDK, is what's missing here: the flake's `flutter` dev
      # shell has no Windows counterpart at all. (The macOS job skips that
      # shell too, but for its own reason — see above.) So this job pins the
      # SDK by hand to whatever `nix develop .#flutter --command flutter
      # --version` resolves to (3.41.6 / Dart 3.11.4), keeping all three
      # jobs on one toolchain. Bump both pins in the same commit that moves
      # flake.lock's nixpkgs, or the two non-Nix jobs silently start
      # compiling against a different Flutter than the Linux one.
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: apps/flutter
        run: flutter pub get

      # No `dart format` / `flutter analyze` / `flutter test` here — those
      # gates are host-independent and the Linux and macOS jobs already run
      # them. What only this job can prove is that the Windows embedder and
      # the native plugin half of the dependency tree link: media_kit's
      # libmpv, flutter_secure_storage's DPAPI backend, url_launcher.
      #
      # Release rather than debug (the other two jobs build debug) so the
      # uploaded artifact is something a Windows user can actually run.
      # Nothing about that artifact is validated — no Windows dev shell, no
      # integration test, no manual pass; a green job means "it compiles and
      # bundles", not "it works".
      - name: Flutter Windows release build
        working-directory: apps/flutter
        run: flutter build windows --release

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: stash-player-flutter-windows-x64
          path: apps/flutter/build/windows/x64/runner/Release/
          if-no-files-found: error
