name: macOS

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Cancel in-flight builds on the same ref — macOS runner minutes are scarce.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # Match the Swift target's deployment floor (apps/macos/project.yml).
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build:
    name: Build StashPlayer.app
    # macos-15 is Apple Silicon and now ships multiple Xcode versions —
    # the setup-xcode step below pins to a release that includes the
    # macOS 26 (Tahoe) SDK so the player's `.glassEffect(_:in:)` calls
    # resolve at compile time. The `if #available(macOS 26.0, *)` guard
    # only gates *execution*; the symbol must still exist in the SDK
    # being linked against. Matches the aarch64-apple-darwin staticlib
    # that build-macos-xcframework.sh produces.
    runs-on: macos-15
    env:
      APP_PATH: build-aux/macos-derived/Build/Products/Release/StashPlayer.app
      ZIP_PATH: StashPlayer-macos-arm64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode (macOS 26 SDK)
        # Tahoe SDK is required because Scene/VisualEffectView.swift uses
        # `.glassEffect(_:in:)` (macOS 26+). `latest-stable` picks the
        # newest non-beta Xcode installed on the runner image; if the
        # image ever lags and stops shipping Tahoe-capable Xcode, pin to
        # an explicit version (e.g. xcode-version: "26.0") here.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          # Bumped from `macos` after the previous cache poisoned
          # ~/.cargo/bin (see cache-bin note below). Bump again if the
          # restore ever lands a broken cargo shim.
          shared-key: macos-v2
          # Don't cache ~/.cargo/bin — rustup's shim binaries are
          # hardlinks to a single `rustup-init`, and tar restores them
          # as independent copies. The restored `cargo` then runs as
          # rustup-init and rejects `cargo build` with "unexpected
          # argument 'build'". The runner re-installs rustup each job
          # anyway, so there's nothing to gain from caching this dir.
          cache-bin: "false"

      - name: Install xcodegen
        run: brew install xcodegen

      # Fork PRs can't read repo secrets, so fall back to ad-hoc signing
      # there instead of failing the job. Same-repo pushes/PRs and tag
      # builds get the real Developer ID identity.
      - name: Determine signing mode
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "Signing mode: developer-id"
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "Signing mode: ad-hoc (no MACOS_CERTIFICATE secret)"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      - name: Build stash-player-ffi xcframework
        run: ./build-aux/build-macos-xcframework.sh

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: apps/macos

      - name: Build StashPlayer.app (Release)
        env:
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          DEVELOPMENT_TEAM_ID: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
        # `Developer ID Application` matches as a prefix — xcodebuild picks
        # the unique cert imported into the temp keychain. Hardened runtime
        # is already enabled in project.yml; --timestamp gives us the
        # secure timestamp notarytool requires.
        run: |
          set -euo pipefail

          # Derive the marketing version from the tag (v0.3.0 → 0.3.0). On
          # non-tag builds (push to main, PRs), fall back to 0.0.0 so the
          # bundle still builds — Sparkle's appcast comparison never trips
          # against 0.0.0 because the production appcast is only published
          # from tag builds (see the `appcast` job).
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="0.0.0"
          fi
          echo "Building bundle version: $VERSION"

          if [ "$SIGN_MODE" = "developer-id" ]; then
            SIGN_IDENTITY="Developer ID Application"
            TEAM_ID="$DEVELOPMENT_TEAM_ID"
            EXTRA_FLAGS="--timestamp"
            # An explicit (empty) entitlements file is required for
            # notarization — without one xcodebuild auto-injects
            # `com.apple.security.get-task-allow=YES`, which the notary
            # service rejects ("debugger-attachable" apps can't ship).
            ENTITLEMENTS="$PWD/apps/macos/StashPlayer/StashPlayer.Release.entitlements"
          else
            SIGN_IDENTITY="-"
            TEAM_ID=""
            EXTRA_FLAGS=""
            ENTITLEMENTS=""
          fi

          # ARCHS=arm64 / ONLY_ACTIVE_ARCH=NO restricts to arm64 — Release
          # would otherwise build a universal binary, but the xcframework
          # only ships an aarch64-apple-darwin staticlib so x86_64 linking
          # fails. Drop these once the build script lipos in x86_64.
          # MARKETING_VERSION / CURRENT_PROJECT_VERSION flow through to
          # Info.plist's $(MARKETING_VERSION) / $(CURRENT_PROJECT_VERSION)
          # substitutions declared in apps/macos/project.yml's info.properties.
          xcodebuild \
            -project apps/macos/StashPlayer.xcodeproj \
            -scheme StashPlayer \
            -configuration Release \
            -derivedDataPath build-aux/macos-derived \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="$EXTRA_FLAGS" \
            build

      - name: Verify Info.plist version (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        # Cheap belt-and-suspenders check: if xcodegen ever regenerates the
        # project and drops the $(MARKETING_VERSION) substitution from
        # info.properties, the bundle would ship with the literal string,
        # Sparkle would compare it against future appcast items, and the
        # entire update channel would silently break. Fail the build loudly
        # before notarization wastes anyone's time.
        run: |
          set -euo pipefail
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL=$(plutil -extract CFBundleShortVersionString raw "$APP_PATH/Contents/Info.plist")
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "Info.plist CFBundleShortVersionString=$ACTUAL does not match tag $EXPECTED" >&2
            exit 1
          fi
          echo "Info.plist version: $ACTUAL (matches tag)"

      - name: Verify signature
        if: steps.signing.outputs.mode == 'developer-id'
        run: |
          codesign -dv --verbose=4 "$APP_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

      - name: Package .app into zip
        # `ditto -c -k --keepParent` preserves symlinks and Apple metadata
        # better than `zip` — important for a .app bundle.
        run: |
          test -d "$APP_PATH" || { echo "no .app at $APP_PATH" >&2; exit 1; }
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          ls -lh "$ZIP_PATH"

      # Notarize only on `v*` tags — pushes/PRs are signed but skip the
      # 1–5 min round-trip to Apple's notary service.
      - name: Notarize and staple
        if: startsWith(github.ref, 'refs/tags/v') && steps.signing.outputs.mode == 'developer-id'
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY" | base64 --decode > "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT

          # `--wait` blocks until Apple finishes (typically <5 min). Exits
          # non-zero if status != Accepted; we still fetch the log either
          # way so failures are debuggable from the run summary.
          set +e
          SUBMIT_OUT=$(xcrun notarytool submit "$ZIP_PATH" \
            --key "$KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json)
          RESULT=$?
          set -e
          echo "$SUBMIT_OUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | jq -r '.id // empty')
          if [ -n "$SUBMISSION_ID" ]; then
            echo "==> Notarization log for $SUBMISSION_ID"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
          fi

          if [ "$RESULT" -ne 0 ]; then
            exit "$RESULT"
          fi

          # Staple the ticket onto the .app, then re-zip so consumers get
          # an offline-validatable bundle (no network call on first launch).
          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          rm -f "$ZIP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

          # Confirm Gatekeeper is happy with the stapled bundle.
          spctl --assess --type execute --verbose "$APP_PATH"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: StashPlayer-macos-arm64
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  release:
    name: Attach .app to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: StashPlayer-macos-arm64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: StashPlayer-macos-arm64.zip
          generate_release_notes: true

  appcast:
    name: Publish Sparkle appcast
    needs: release
    # Stable channel only — `!contains(...,'-')` rejects pre-release tags
    # like `v0.3.0-beta.1`. CFBundleVersion comparison would behave badly
    # against hyphenated strings; the brainstorm scoped beta out of v1.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: macos-15
    permissions:
      contents: write
    # Job-level group serializes all `appcast` jobs across every tag —
    # the workflow-level `macos-${{ github.ref }}` group only covers same-ref
    # cancellations, so two different tags pushed in quick succession would
    # otherwise race on the `git push gh-pages`. `cancel-in-progress: false`
    # ensures both tags' appcast updates land in order.
    concurrency:
      group: appcast-publish
      cancel-in-progress: false
    env:
      # Pin Sparkle release + digest. Bumping SPARKLE_VERSION requires
      # re-computing SPARKLE_SHA256 in the same commit (without it, an
      # attacker who replaces the GitHub release asset gets `generate_appcast`
      # running with the EdDSA private key on stdin — total compromise).
      # Compute: curl ...tar.xz | shasum -a 256
      SPARKLE_VERSION: "2.9.2"
      SPARKLE_SHA256: "1cb340cbbef04c6c0d162078610c25e2221031d794a3449d89f2f56f4df77c95"
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download current + prior release zips
        # Pull the just-released zip plus the prior 9 releases so the
        # regenerated appcast carries up to 10 historical entries. Needed
        # for the dual-key rotation procedure to work (users on the old key
        # need a transition release in the feed) and so users on an older
        # macOS who cannot install the latest can still find an installable
        # intermediate version.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Take up to the 10 most recent v* tags (current release plus 9
          # historicals). `gh release list` returns newest first.
          TAGS=$(gh release list --limit 10 --json tagName -q '.[].tagName')

          for TAG in $TAGS; do
            echo "==> Fetching StashPlayer-macos-arm64.zip from $TAG"
            # `|| true` tolerates pre-Sparkle releases that don't have the
            # canonical asset name; missing historical assets shouldn't fail
            # the whole publish.
            gh release download "$TAG" \
              --pattern 'StashPlayer-macos-arm64.zip' \
              --dir "release-assets/$TAG" || echo "  (no matching asset, skipping)"
          done

          # Flatten into a single dir so `generate_appcast` sees them all.
          # Rename each to `StashPlayer-macos-arm64-<tag>.zip` so they have
          # unique stems and so a same-stem release-notes sidecar only pairs
          # with the current release.
          for TAG in $TAGS; do
            SRC="release-assets/$TAG/StashPlayer-macos-arm64.zip"
            [ -f "$SRC" ] || continue
            if [ "$TAG" = "$GITHUB_REF_NAME" ]; then
              # Current release keeps the canonical name so the .html
              # sidecar (next step) auto-pairs to it.
              cp "$SRC" "release-assets/StashPlayer-macos-arm64.zip"
            else
              cp "$SRC" "release-assets/StashPlayer-macos-arm64-${TAG}.zip"
            fi
          done

          rm -rf release-assets/v*  # drop the per-tag subdirs after flattening
          ls -lh release-assets/

      - name: Install pandoc + generate release notes HTML sidecar
        # pandoc is NOT pre-installed on macos-15 runners (verified against
        # actions/runner-images manifest). `generate_appcast` auto-pairs a
        # `.html` file with the matching `.zip` stem and emits it as
        # `<sparkle:releaseNotesLink>`.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew install pandoc

          BODY=$(gh release view "$GITHUB_REF_NAME" --json body -q .body)
          if [ -z "$BODY" ]; then
            BODY="No release notes for this version."
          fi
          printf '%s' "$BODY" | pandoc -f gfm -t html \
            -o release-assets/StashPlayer-macos-arm64.html
          echo "Generated release-assets/StashPlayer-macos-arm64.html"

      - name: Install Sparkle (pinned tarball + SHA-256 verify)
        run: |
          set -euo pipefail
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf sparkle.tar.xz
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Sign + regenerate appcast
        # Owned `run:` block so a non-zero exit aborts before the next step
        # touches the live gh-pages/appcast.xml. EdDSA private key is written
        # to a mode-600 mktemp file (not piped via `echo`, which would put
        # the value in the shell's argument space briefly) and shredded in a
        # trap so it never persists on disk after the step.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp -t sparkle_ed.XXXXXX)"
          chmod 600 "$KEY_FILE"
          trap 'rm -P "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"

          generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --maximum-versions 10 \
            release-assets/

          # Sanity-check the generated feed has an item for this tag.
          grep -q "sparkle:version" release-assets/appcast.xml
          echo "Appcast generated for ${GITHUB_REF_NAME}"

      - name: Publish appcast to gh-pages
        # Separate `run:` block — runs only if signing succeeded. Push has
        # a single pull --rebase retry as belt-and-suspenders in case the
        # appcast-publish concurrency group ever fails to serialize two
        # cross-tag jobs.
        run: |
          set -euo pipefail
          cp release-assets/appcast.xml gh-pages/appcast.xml

          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml

          if git diff --cached --quiet; then
            echo "No appcast changes to commit"
            exit 0
          fi

          git commit -m "appcast: ${GITHUB_REF_NAME}"
          git push || { git pull --rebase origin gh-pages && git push; }
