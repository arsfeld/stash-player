name: macOS

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      notarize:
        description: "Notarize this build (release-candidate testing)"
        type: boolean
        default: false

# Cancel in-flight builds on the same ref — macOS runner minutes are scarce.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build StashPlayer.app
    runs-on: macos-15
    env:
      DERIVED_DATA: apps/flutter/build/macos-derived
      APP_PATH: apps/flutter/build/macos-derived/Build/Products/Release/StashPlayer.app
      ZIP_PATH: StashPlayer-macos-arm64.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Same pin as flutter.yml and the Flatpak manifest; bump all three
      # together with flake.lock.
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      # Fork PRs can't read repo secrets, so fall back to ad-hoc signing
      # there instead of failing the job. Same-repo pushes/PRs and tag
      # builds get the real Developer ID identity.
      - name: Determine signing mode
        id: signing
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            echo "mode=developer-id" >> "$GITHUB_OUTPUT"
            echo "Signing mode: developer-id"
          else
            echo "mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "Signing mode: ad-hoc (no MACOS_CERTIFICATE secret)"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.mode == 'developer-id'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}

      # Generates macos/Flutter/ephemeral (FLUTTER_ROOT etc.) and the plugin
      # registrant without building, so xcodebuild below owns signing.
      - name: Prepare Flutter macOS project
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter build macos --release --config-only
          cd macos && pod install

      - name: Build StashPlayer.app (Release)
        env:
          SIGN_MODE: ${{ steps.signing.outputs.mode }}
          DEVELOPMENT_TEAM_ID: ${{ secrets.MACOS_DEVELOPMENT_TEAM }}
        run: |
          set -euo pipefail

          # v1.2.3 → 1.2.3; non-tag builds get 0.0.0, which Sparkle never
          # prefers over a published appcast item.
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then
            VERSION="0.0.0"
          fi
          echo "Building bundle version: $VERSION"

          if [ "$SIGN_MODE" = "developer-id" ]; then
            SIGN_IDENTITY="Developer ID Application"
            TEAM_ID="$DEVELOPMENT_TEAM_ID"
            EXTRA_FLAGS="--timestamp"
          else
            SIGN_IDENTITY="-"
            TEAM_ID=""
            EXTRA_FLAGS=""
          fi

          # FLUTTER_BUILD_NAME / FLUTTER_BUILD_NUMBER feed Info.plist's
          # CFBundleShortVersionString / CFBundleVersion. Both get the dotted
          # version: Sparkle compares CFBundleVersion, and the SwiftUI
          # releases already in the feed carry dotted values there.
          # Entitlements and the hardened runtime come from the Runner's
          # Release configuration (Release.entitlements, Release.xcconfig).
          xcodebuild \
            -workspace apps/flutter/macos/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -derivedDataPath "$DERIVED_DATA" \
            -destination 'generic/platform=macOS' \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            FLUTTER_BUILD_NAME="$VERSION" \
            FLUTTER_BUILD_NUMBER="$VERSION" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="$EXTRA_FLAGS" \
            build

      - name: Verify Info.plist identity and version
        run: |
          set -euo pipefail
          PLIST="$APP_PATH/Contents/Info.plist"
          test "$(plutil -extract CFBundleIdentifier raw "$PLIST")" = "dev.arsfeld.stash-player"
          test "$(plutil -extract SUFeedURL raw "$PLIST")" = "https://arsfeld.github.io/stash-player/appcast.xml"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            EXPECTED="${GITHUB_REF_NAME#v}"
            for key in CFBundleShortVersionString CFBundleVersion; do
              ACTUAL=$(plutil -extract "$key" raw "$PLIST")
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "Info.plist $key=$ACTUAL does not match tag $EXPECTED" >&2
                exit 1
              fi
            done
          fi
          echo "Info.plist OK"

      - name: Re-sign nested code
        if: steps.signing.outputs.mode == 'developer-id'
        # Sparkle ships its helpers (Updater.app, Autoupdate, XPC services)
        # signed by the Sparkle project without a secure timestamp, and
        # the embed phase doesn't recurse into them; the notary service
        # rejects the result. Re-sign deepest-first: Sparkle's helpers,
        # then every embedded framework (Sparkle, media_kit's libmpv
        # frameworks, plugin frameworks), then the outer app so its seal
        # covers the new signatures.
        run: |
          set -euo pipefail
          SIGN_IDENTITY="Developer ID Application"
          ENTITLEMENTS="$PWD/apps/flutter/macos/Runner/Release.entitlements"
          FRAMEWORKS="$APP_PATH/Contents/Frameworks"
          SPARKLE_FW="$FRAMEWORKS/Sparkle.framework"

          for item in \
            "Versions/B/XPCServices/Downloader.xpc" \
            "Versions/B/XPCServices/Installer.xpc" \
            "Versions/B/Autoupdate" \
            "Versions/B/Updater.app"; do
            if [ -e "$SPARKLE_FW/$item" ]; then
              echo "==> Re-signing Sparkle $item"
              codesign --force --sign "$SIGN_IDENTITY" --timestamp --options runtime "$SPARKLE_FW/$item"
            fi
          done

          find "$FRAMEWORKS" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -print0 |
            while IFS= read -r -d '' fw; do
              echo "==> Re-signing $(basename "$fw")"
              codesign --force --sign "$SIGN_IDENTITY" --timestamp --options runtime "$fw"
            done

          echo "==> Re-signing StashPlayer.app"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" "$APP_PATH"

      - name: Verify signature
        if: steps.signing.outputs.mode == 'developer-id'
        run: |
          codesign -dv --verbose=4 "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          # No sandbox and no get-task-allow may reach a shipped bundle.
          ENTS=$(codesign -d --entitlements - --xml "$APP_PATH" 2>/dev/null || true)
          echo "$ENTS"
          # A failed or empty dump must not pass as "no bad entitlements".
          if [[ "$ENTS" != *"<dict"* ]]; then
            echo "could not read the bundle's entitlements" >&2
            exit 1
          fi
          if echo "$ENTS" | grep -qE "app-sandbox|get-task-allow"; then
            echo "unexpected entitlement in release bundle" >&2
            exit 1
          fi

      - name: Package .app into zip
        run: |
          test -d "$APP_PATH" || { echo "no .app at $APP_PATH" >&2; exit 1; }
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          ls -lh "$ZIP_PATH"

      # Notarize on `v*` tags, or on a workflow_dispatch run with
      # `notarize: true` — other pushes/PRs are signed but skip the 1–5 min
      # round-trip to Apple's notary service.
      - name: Notarize and staple
        if: steps.signing.outputs.mode == 'developer-id' && (startsWith(github.ref, 'refs/tags/v') || inputs.notarize)
        env:
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$NOTARY_KEY" | base64 --decode > "$KEY_PATH"
          trap 'rm -f "$KEY_PATH"' EXIT

          set +e
          SUBMIT_OUT=$(xcrun notarytool submit "$ZIP_PATH" \
            --key "$KEY_PATH" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json)
          RESULT=$?
          set -e
          echo "$SUBMIT_OUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUT" | jq -r '.id // empty')
          if [ -n "$SUBMISSION_ID" ]; then
            echo "==> Notarization log for $SUBMISSION_ID"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" || true
          fi

          if [ "$RESULT" -ne 0 ]; then
            exit "$RESULT"
          fi

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          rm -f "$ZIP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH"

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: StashPlayer-macos-arm64
          path: ${{ env.ZIP_PATH }}
          if-no-files-found: error

  release:
    name: Attach .app to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: StashPlayer-macos-arm64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: StashPlayer-macos-arm64.zip
          generate_release_notes: true

  appcast:
    name: Publish Sparkle appcast
    needs: release
    # Stable channel only — `!contains(...,'-')` rejects pre-release tags
    # like `v0.3.0-beta.1`. CFBundleVersion comparison would behave badly
    # against hyphenated strings; the brainstorm scoped beta out of v1.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')
    runs-on: macos-15
    permissions:
      contents: write
    # Job-level group serializes all `appcast` jobs across every tag —
    # the workflow-level `macos-${{ github.ref }}` group only covers same-ref
    # cancellations, so two different tags pushed in quick succession would
    # otherwise race on the `git push gh-pages`. GitHub runs at most one job
    # per group plus at most one pending behind it — even with
    # `cancel-in-progress: false` a newer pending run supersedes an older
    # pending one — so runs never overlap, but a queued run for an older tag
    # can be skipped for a newer one rather than landing in order; either way
    # gh-pages ends up with the newest tag's state.
    concurrency:
      group: appcast-publish
      cancel-in-progress: false
    env:
      # Pin Sparkle release + digest. Bumping SPARKLE_VERSION requires
      # re-computing SPARKLE_SHA256 in the same commit (without it, an
      # attacker who replaces the GitHub release asset gets `generate_appcast`
      # running with the EdDSA private key on stdin — total compromise).
      # Compute: curl ...tar.xz | shasum -a 256
      SPARKLE_VERSION: "2.9.2"
      SPARKLE_SHA256: "1cb340cbbef04c6c0d162078610c25e2221031d794a3449d89f2f56f4df77c95"
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download current + prior release zips
        # Pull the just-released zip plus the prior 9 releases so the
        # regenerated appcast carries up to 10 historical entries. Needed
        # for the dual-key rotation procedure to work (users on the old key
        # need a transition release in the feed) and so users on an older
        # macOS who cannot install the latest can still find an installable
        # intermediate version.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Take up to the 10 most recent v* tags (current release plus 9
          # historicals). `gh release list` returns newest first.
          # `--repo "$GITHUB_REPOSITORY"` is required because the previous
          # `actions/checkout@v4 path: gh-pages` step puts the repo in a
          # subdirectory, so the workspace root is not a git repo and `gh`
          # cannot infer the target repo from git context.
          TAGS=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 10 --json tagName -q '.[].tagName')

          for TAG in $TAGS; do
            echo "==> Fetching StashPlayer-macos-arm64.zip from $TAG"
            # `|| echo` tolerates pre-Sparkle releases that don't have the
            # canonical asset name; missing historical assets shouldn't fail
            # the whole publish.
            gh release download "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'StashPlayer-macos-arm64.zip' \
              --dir "release-assets/$TAG" || echo "  (no matching asset, skipping)"
          done

          # Flatten into a single dir so `generate_appcast` sees them all.
          # Rename each to `StashPlayer-macos-arm64-<tag>.zip` so they have
          # unique stems and so a same-stem release-notes sidecar only pairs
          # with the current release.
          for TAG in $TAGS; do
            SRC="release-assets/$TAG/StashPlayer-macos-arm64.zip"
            [ -f "$SRC" ] || continue
            if [ "$TAG" = "$GITHUB_REF_NAME" ]; then
              # Current release keeps the canonical name so the .html
              # sidecar (next step) auto-pairs to it.
              cp "$SRC" "release-assets/StashPlayer-macos-arm64.zip"
            else
              cp "$SRC" "release-assets/StashPlayer-macos-arm64-${TAG}.zip"
            fi
          done

          rm -rf release-assets/v*  # drop the per-tag subdirs after flattening

          # Sparkle's generate_appcast rejects two archives with the same
          # CFBundleVersion. Pre-PR#6 releases (v0.2.x, v0.3.x) were all
          # built with the hardcoded Info.plist default `CFBundleVersion =
          # 1`; every one of those zips reports the same version and would
          # trigger the duplicate check. Drop them. Sparkle's own version
          # comparator already considers anything < the running app's
          # version unviable, so excluding these from the feed has no
          # downside (a user on an old build that thinks itself "1"
          # against an appcast item version "0.4.3" will still see the
          # upgrade prompt). Note: dotted-integer comparison in Sparkle
          # treats "0.4.3" as greater than "1" because component-by-
          # component "0" < "1" only at the first position; the existing
          # comparator inspects each component independently.
          for zip in release-assets/*.zip; do
            [ -f "$zip" ] || continue
            tmpdir=$(mktemp -d)
            unzip -q "$zip" -d "$tmpdir"
            app=$(find "$tmpdir" -maxdepth 2 -type d -name '*.app' | head -1)
            if [ -n "$app" ] && [ -f "$app/Contents/Info.plist" ]; then
              bv=$(plutil -extract CFBundleVersion raw "$app/Contents/Info.plist" 2>/dev/null || echo "")
              if [ "$bv" = "1" ] || [ -z "$bv" ]; then
                echo "  drop $(basename "$zip") — CFBundleVersion=\"$bv\" (pre-injection)"
                rm -f "$zip"
              fi
            else
              echo "  drop $(basename "$zip") — no .app inside, malformed zip"
              rm -f "$zip"
            fi
            rm -rf "$tmpdir"
          done

          echo "==> Final appcast staging dir:"
          ls -lh release-assets/

      - name: Install pandoc + generate release notes HTML sidecar
        # pandoc is NOT pre-installed on macos-15 runners (verified against
        # actions/runner-images manifest). `generate_appcast` auto-pairs a
        # `.html` file with the matching `.zip` stem and emits it as
        # `<sparkle:releaseNotesLink>`.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew install pandoc

          BODY=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body)
          if [ -z "$BODY" ]; then
            BODY="No release notes for this version."
          fi
          printf '%s' "$BODY" | pandoc -f gfm -t html \
            -o release-assets/StashPlayer-macos-arm64.html
          echo "Generated release-assets/StashPlayer-macos-arm64.html"

      - name: Install Sparkle (pinned tarball + SHA-256 verify)
        run: |
          set -euo pipefail
          curl -fsSL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "${SPARKLE_SHA256}  sparkle.tar.xz" | shasum -a 256 -c -
          tar -xJf sparkle.tar.xz
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Sign + regenerate appcast
        # Owned `run:` block so a non-zero exit aborts before the next step
        # touches the live gh-pages/appcast.xml. EdDSA private key is written
        # to a mode-600 mktemp file (not piped via `echo`, which would put
        # the value in the shell's argument space briefly) and shredded in a
        # trap so it never persists on disk after the step.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          KEY_FILE="$(mktemp -t sparkle_ed.XXXXXX)"
          chmod 600 "$KEY_FILE"
          trap 'rm -P "$KEY_FILE" 2>/dev/null || rm -f "$KEY_FILE"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"

          generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --maximum-versions 10 \
            release-assets/

          # `--download-url-prefix` points every enclosure at this tag's
          # release, but historical zips were staged under renamed copies
          # (`StashPlayer-macos-arm64-<tag>.zip`) that only exist on their
          # own tag's release, as `StashPlayer-macos-arm64.zip`. Point them
          # back there. The feed itself isn't signed (only the archives are,
          # and their EdDSA signatures cover bytes, not URLs), so rewriting
          # URLs after generation is safe.
          sed -E -i '' \
            "s#/releases/download/${GITHUB_REF_NAME}/StashPlayer-macos-arm64-(v[^/\"]+)\.zip#/releases/download/\1/StashPlayer-macos-arm64.zip#g" \
            release-assets/appcast.xml

          # Sanity-check the generated feed has an item for this tag.
          grep -q "sparkle:version" release-assets/appcast.xml
          echo "Appcast generated for ${GITHUB_REF_NAME}"

      - name: Attach delta updates to the GitHub Release
        # generate_appcast writes a `.delta` per prior version into
        # release-assets/ and lists each one in the feed under this tag's
        # release. Upload them before the feed goes live, or every client
        # 404s on the delta and falls back to the full zip.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          DELTAS=(release-assets/*.delta)
          if [ ${#DELTAS[@]} -eq 0 ]; then
            echo "No delta updates generated"
            exit 0
          fi
          gh release upload "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            "${DELTAS[@]}"

      - name: Publish appcast to gh-pages
        # Separate `run:` block — runs only if signing succeeded. Push has
        # a single pull --rebase retry as belt-and-suspenders in case the
        # appcast-publish concurrency group ever fails to serialize two
        # cross-tag jobs.
        run: |
          set -euo pipefail
          cp release-assets/appcast.xml gh-pages/appcast.xml

          cd gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast.xml

          if git diff --cached --quiet; then
            echo "No appcast changes to commit"
            exit 0
          fi

          git commit -m "appcast: ${GITHUB_REF_NAME}"
          git push || { git pull --rebase origin gh-pages && git push; }
