[package]
name = "stash-api"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.3", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
url = "2.5.8"

[dev-dependencies]
dotenvy = "0.15.7"
tokio = { version = "1.52.3", features = ["rt", "macros"] }
