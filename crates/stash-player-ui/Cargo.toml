[package]
name = "stash-player-ui"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.1", package = "libadwaita", features = ["v1_5"] }
dotenvy = "0.15.7"
gtk = { version = "0.11.3", package = "gtk4", features = ["v4_14"] }
image = { version = "0.25.5", default-features = false, features = ["jpeg", "png", "webp"] }
relm4 = { version = "0.11.0", features = ["libadwaita"] }
stash-api = { version = "0.1.0", path = "../stash-api" }
stash-player-core = { version = "0.1.0", path = "../stash-player-core" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
